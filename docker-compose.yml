services:
  chore-board:
    build: .
    container_name: chore-board
    restart: unless-stopped
    ports:
      - "8080:8080"          # http://<NAS-IP>:8080  — change the left number to use another host port
    environment:
      - PORT=8080
      - DATA_FILE=/data/state.json
    volumes:
      - ./data:/data         # persists the shared chore state on the NAS, survives container rebuilds
